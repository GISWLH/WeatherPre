name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      network:
        description: "Also run live-data tests (WeatherBench 2 / NOAA S3)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check weatherpre tests scripts
      - name: Unit tests (offline)
        run: pytest -q
      - name: Live-data tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.network }}
        env:
          WEATHERPRE_NETWORK: "1"
        run: pytest -q -m network
      - name: CLI smoke test
        run: weatherpre models --all
